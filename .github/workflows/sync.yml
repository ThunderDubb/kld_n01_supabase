name: Synchronizacja N01

on:
  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
    - cron: "17 22 * * *"

concurrency:
  group: n01-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Pobranie danych N01
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py
